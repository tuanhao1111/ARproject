<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>杜鵑花 · AR</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,500;0,600;1,400&family=Be+Vietnam+Pro:wght@300;400;500;600&family=Noto+Serif+TC:wght@400;500;600&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet" />

<style>
  :root{
    --plum:#2a1235; --mulberry:#5c2a5e; --blush:#f9c6d9;
    --azalea:#ff5c8a; --magenta:#c61e63; --cream:#fff4f7; --pollen:#ffd9a0;
    --bg-top:#3a1a44; --bg-bottom:#1c0c26;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    font-family:"Be Vietnam Pro", system-ui, sans-serif;
    color:var(--cream);
    background:
      radial-gradient(120% 90% at 50% -10%, var(--bg-top) 0%, transparent 55%),
      linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    background-attachment:fixed;
    overflow-x:hidden; -webkit-font-smoothing:antialiased;
  }

  /* ===== Font theo ngôn ngữ ===== */
  body.lang-en{ font-family:"Be Vietnam Pro", system-ui, sans-serif; }
  body.lang-en .display, body.lang-en .lede{ font-family:"Cormorant", serif; }
  body.lang-zh{ font-family:"Noto Sans TC", system-ui, sans-serif; }
  body.lang-zh .display, body.lang-zh .lede{ font-family:"Noto Serif TC", serif; }
  body.lang-zh .hero-title{ letter-spacing:.12em; font-size:clamp(3.6rem, 15vw, 11rem); }
  body.lang-zh .lede{ line-height:1.55; max-width:22ch; }
  body.lang-zh .lede .accent{ font-style:normal; }
  body.lang-zh .eyebrow{ letter-spacing:.3em; }

  #scene{ position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }
  .vignette{ position:fixed; inset:0; z-index:1; pointer-events:none;
    background:radial-gradient(130% 100% at 50% 40%, transparent 55%, rgba(20,8,28,.55) 100%); }
  .page{ position:relative; z-index:2; }
  .panel{ min-height:100svh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:14vh 7vw; }

  /* ===== Nút chuyển ngôn ngữ ===== */
  .lang-toggle{ position:fixed; top:max(1.2rem, env(safe-area-inset-top)); right:1.2rem; z-index:20;
    display:flex; gap:.25rem; padding:.25rem; border-radius:999px;
    background:rgba(42,18,53,.45); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    border:1px solid rgba(255,244,247,.18); }
  .lang-toggle button{ font-family:"Be Vietnam Pro", sans-serif; font-size:.8rem; font-weight:500;
    letter-spacing:.05em; color:rgba(255,244,247,.7); background:none; border:none; cursor:pointer;
    padding:.45em 1em; border-radius:999px; transition:color .3s, background .3s; }
  .lang-toggle button:hover{ color:var(--cream); }
  .lang-toggle button.active{ color:var(--plum); background:linear-gradient(135deg, var(--blush), var(--azalea)); }
  .lang-toggle button:focus-visible{ outline:2px solid var(--cream); outline-offset:2px; }

  /* Fallback reveal (khi KHÔNG có GSAP) */
  .reveal{ opacity:0; transform:translateY(34px);
    transition:opacity 1.1s cubic-bezier(.2,.7,.2,1), transform 1.1s cubic-bezier(.2,.7,.2,1); }
  .reveal.in{ opacity:1; transform:none; }
  .gsap-on .reveal{ opacity:1; transform:none; transition:none; }

  .eyebrow{ font-size:.78rem; font-weight:500; letter-spacing:.42em;
    text-transform:uppercase; color:var(--azalea); margin-bottom:1.6rem; }

  .display{ font-family:"Cormorant", serif; font-weight:500; line-height:.96;
    letter-spacing:.01em; text-shadow:0 0 40px rgba(255,92,138,.35); }
  .hero-title{ font-size:clamp(4.2rem, 17vw, 13rem); }
  .hero-title .t-main{ display:block; }
  .hero-title em{ font-style:italic; font-weight:400; color:var(--blush);
    display:block; font-size:.42em; letter-spacing:.06em; margin-top:.4em; text-shadow:none;
    font-family:"Cormorant", serif; }

  .lede{ font-family:"Cormorant", serif; font-size:clamp(1.9rem, 5.2vw, 3.4rem);
    font-weight:400; line-height:1.32; max-width:18ch; color:var(--cream); }
  .lede .accent{ color:var(--azalea); font-style:italic; }
  .note{ margin-top:1.8rem; font-size:clamp(.95rem, 2.4vw, 1.1rem);
    font-weight:300; line-height:1.7; max-width:42ch; color:rgba(255,244,247,.72); }

  .char{ display:inline-block; will-change:transform, opacity; }

  .scroll-hint{ position:absolute; bottom:4.5vh; left:50%; transform:translateX(-50%);
    display:flex; flex-direction:column; align-items:center; gap:.8rem;
    font-size:.72rem; letter-spacing:.34em; text-transform:uppercase; color:rgba(255,244,247,.6); }
  .scroll-hint .line{ width:1px; height:46px; background:linear-gradient(var(--azalea), transparent);
    animation:drip 2.4s ease-in-out infinite; }
  @keyframes drip{ 0%{transform:scaleY(0);transform-origin:top;opacity:0}
    40%{transform:scaleY(1);transform-origin:top;opacity:1}
    60%{transform:scaleY(1);transform-origin:bottom;opacity:1}
    100%{transform:scaleY(0);transform-origin:bottom;opacity:0} }

  .cta{ margin-top:2.6rem; display:inline-flex; align-items:center; gap:.7em;
    font-family:"Be Vietnam Pro", sans-serif; font-size:1.02rem; font-weight:500; letter-spacing:.02em;
    color:var(--plum); background:linear-gradient(135deg, var(--blush), var(--azalea));
    border:none; border-radius:999px; padding:1.05em 2.4em; cursor:pointer;
    box-shadow:0 8px 40px rgba(255,92,138,.45), inset 0 0 0 1px rgba(255,255,255,.3);
    transition:box-shadow .35s ease; will-change:transform; }
  .cta:hover{ box-shadow:0 14px 54px rgba(255,92,138,.6), inset 0 0 0 1px rgba(255,255,255,.45); }
  .cta:focus-visible{ outline:3px solid var(--cream); outline-offset:4px; }
  .cta .dot{ width:.5em; height:.5em; border-radius:50%; background:var(--plum);
    box-shadow:0 0 0 .28em rgba(42,18,53,.18); animation:pulse 1.8s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.35} }

  #flash{ position:fixed; inset:0; z-index:30;
    background:radial-gradient(circle at 50% 55%, var(--blush), var(--azalea) 45%, var(--plum) 100%);
    opacity:0; pointer-events:none; transition:opacity .9s ease; }
  #flash.on{ opacity:1; }

  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior:auto; } .reveal{ transition-duration:.3s; }
    .scroll-hint .line{ animation:none; } .cta .dot{ animation:none; }
  }
</style>
</head>
<body class="lang-zh">

  <canvas id="scene"></canvas>
  <div class="vignette"></div>

  <div class="lang-toggle" role="group" aria-label="語言 / Language">
    <button type="button" data-lang="zh" class="active">繁中</button>
    <button type="button" data-lang="en">EN</button>
  </div>

  <main class="page">
    <section class="panel" id="hero">
      <p class="eyebrow reveal" data-key="eyebrowHero">AR · 杜鵑花</p>
      <h1 class="display hero-title reveal">
        <span class="t-main" data-key="titleMain">杜鵑花</span>
        <em data-key="titleSub">Azalea · Rhododendron</em>
      </h1>
      <div class="scroll-hint"><span data-key="scrollHint">向下滾動</span><span class="line"></span></div>
    </section>

    <section class="panel">
      <p class="lede reveal" data-key="lede1" data-html>每逢春日，山坡再度<span class="accent">染上緋紅</span>——成千上萬朵杜鵑，於同一個節奏裡綻放。</p>
      <p class="note reveal" data-key="note1">杜鵑是高山的象徵，自冬末綻放至初夏；每一簇五片花瓣上點綴著細小的蜜斑，為蜂蝶指引方向。</p>
    </section>

    <section class="panel">
      <p class="lede reveal" data-key="lede2" data-html>此刻，一朵將在<span class="accent">你的掌心綻放</span>。</p>
      <p class="note reveal" data-key="note2">將鏡頭對準標記圖卡，立體的花朵便會浮現眼前——旋轉、放大，細看每一層花瓣。</p>
    </section>

    <section class="panel" id="enter">
      <p class="eyebrow reveal" data-key="eyebrowEnter">準備就緒</p>
      <p class="lede reveal" data-key="ledeEnter">開啟真實世界。</p>
      <button class="cta" id="startAR" aria-label="開啟擴增實境體驗">
        <span class="dot"></span><span class="cta-label" data-key="ctaLabel">開啟 AR 體驗</span>
      </button>
    </section>
  </main>

  <div id="flash"></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.20/dist/lenis.min.js"></script>

<script type="importmap">
{ "imports": { "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js" } }
</script>

<script type="module">
import * as THREE from "three";

/* ===== Thư viện & môi trường ===== */
const G  = window.gsap;
const ST = window.ScrollTrigger;
const hasGSAP = !!(G && ST);
if (hasGSAP){
  G.registerPlugin(ST);
  if (window.SplitText) G.registerPlugin(window.SplitText);
}
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const isMobile = Math.min(innerWidth, innerHeight) < 720;
const PETAL_COUNT  = isMobile ? 46 : 92;
const POLLEN_COUNT = isMobile ? 130 : 280;

/* ===== Three.js ===== */
const canvas = document.getElementById("scene");
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x2a1235, 0.0075);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 400);
const CAM_START_Z = 62, CAM_END_Z = -92;
camera.position.set(0, 0, CAM_START_Z);
scene.add(camera);

/* ===== Texture ===== */
function makePetalTexture(){
  const s=128, cv=document.createElement("canvas"); cv.width=cv.height=s;
  const c=cv.getContext("2d");
  const glow=c.createRadialGradient(s/2,s/2,4,s/2,s/2,s/2);
  glow.addColorStop(0,"rgba(255,200,220,0.55)"); glow.addColorStop(0.45,"rgba(255,140,180,0.18)");
  glow.addColorStop(1,"rgba(255,140,180,0)"); c.fillStyle=glow; c.fillRect(0,0,s,s);
  c.translate(s/2,s/2);
  const grd=c.createLinearGradient(0,-46,0,46);
  grd.addColorStop(0,"rgba(255,255,255,0.96)"); grd.addColorStop(0.55,"rgba(255,210,228,0.95)");
  grd.addColorStop(1,"rgba(255,150,190,0.9)"); c.fillStyle=grd;
  c.beginPath(); c.moveTo(0,44);
  c.bezierCurveTo(36,26,34,-34,6,-46); c.bezierCurveTo(2,-40,-2,-40,-6,-46);
  c.bezierCurveTo(-34,-34,-36,26,0,44); c.closePath(); c.fill();
  c.fillStyle="rgba(198,30,99,0.5)";
  for(let i=0;i<7;i++){ const a=-0.5+Math.random(), r=6+Math.random()*14;
    c.beginPath(); c.arc(Math.sin(a)*r*0.6,-10+Math.cos(a)*r,1.4,0,Math.PI*2); c.fill(); }
  const t=new THREE.CanvasTexture(cv); t.colorSpace=THREE.SRGBColorSpace; return t;
}
function makePollenTexture(){
  const s=64, cv=document.createElement("canvas"); cv.width=cv.height=s;
  const c=cv.getContext("2d");
  const g=c.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  g.addColorStop(0,"rgba(255,255,255,1)"); g.addColorStop(0.3,"rgba(255,225,180,0.8)");
  g.addColorStop(1,"rgba(255,200,150,0)"); c.fillStyle=g; c.fillRect(0,0,s,s);
  const t=new THREE.CanvasTexture(cv); t.colorSpace=THREE.SRGBColorSpace; return t;
}
const petalTex=makePetalTexture(), pollenTex=makePollenTexture();

/* ===== Cánh hoa ===== */
const PALETTE=[0xffffff,0xffd3e2,0xff9ec4,0xff5c8a,0xffe9c4];
const FIELD_X=46, FIELD_Y=30, FIELD_Z=210;
const petalGeo=new THREE.PlaneGeometry(2.4,3.2); const petals=[];
function resetPetal(m, initial){
  m.position.set((Math.random()-0.5)*FIELD_X*2,(Math.random()-0.5)*FIELD_Y*2,
    initial?(Math.random()*FIELD_Z-150):(camera.position.z-FIELD_Z+Math.random()*20));
  const sc=0.7+Math.random()*1.5; m.scale.set(sc,sc,sc);
  m.rotation.set(Math.random()*Math.PI,Math.random()*Math.PI,Math.random()*Math.PI);
  m.userData={ spin:(Math.random()-0.5)*(reduceMotion?0.003:0.012),
    spin2:(Math.random()-0.5)*(reduceMotion?0.003:0.012),
    swayA:Math.random()*Math.PI*2, swayS:0.4+Math.random()*0.8,
    swayR:0.6+Math.random()*1.4, drift:0.4+Math.random()*0.7 };
}
for(let i=0;i<PETAL_COUNT;i++){
  const mat=new THREE.MeshBasicMaterial({ map:petalTex, transparent:true, depthWrite:false,
    opacity:0.9, color:PALETTE[(Math.random()*PALETTE.length)|0],
    blending:THREE.NormalBlending, side:THREE.DoubleSide });
  const m=new THREE.Mesh(petalGeo,mat); resetPetal(m,true); scene.add(m); petals.push(m);
}

/* ===== Hạt phấn ===== */
const pollenGeo=new THREE.BufferGeometry();
const pPos=new Float32Array(POLLEN_COUNT*3), pBase=[];
for(let i=0;i<POLLEN_COUNT;i++){
  const x=(Math.random()-0.5)*FIELD_X*2, y=(Math.random()-0.5)*FIELD_Y*2, z=Math.random()*FIELD_Z-150;
  pPos[i*3]=x; pPos[i*3+1]=y; pPos[i*3+2]=z; pBase.push({x,phase:Math.random()*Math.PI*2,amp:0.4+Math.random()*1.2});
}
pollenGeo.setAttribute("position",new THREE.BufferAttribute(pPos,3));
const pollenMat=new THREE.PointsMaterial({ map:pollenTex,size:1.5,transparent:true,
  depthWrite:false,blending:THREE.AdditiveBlending,color:0xffd9a0,opacity:0.85 });
const pollen=new THREE.Points(pollenGeo,pollenMat); scene.add(pollen);

/* ===== Hoa nở (climax) ===== */
const bloomGroup=new THREE.Group();
const bloomMat=new THREE.MeshBasicMaterial({ map:petalTex, transparent:true, depthWrite:false,
  side:THREE.DoubleSide, color:0xff77a8, opacity:0, blending:THREE.NormalBlending });
const bloomPetals=[];
for(let i=0;i<5;i++){
  const pivot=new THREE.Object3D(); pivot.rotation.z=i*(Math.PI*2/5); pivot.rotation.x=-1.3;
  const petal=new THREE.Mesh(new THREE.PlaneGeometry(6,8), bloomMat); petal.position.y=4;
  pivot.add(petal); bloomGroup.add(pivot); bloomPetals.push(pivot);
}
const bloomCenterMat=new THREE.SpriteMaterial({ map:pollenTex, color:0xffd9a0,
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, opacity:0 });
const bloomCenter=new THREE.Sprite(bloomCenterMat); bloomCenter.scale.setScalar(3); bloomGroup.add(bloomCenter);
bloomGroup.position.set(0,-1.5,-22); bloomGroup.visible=false; camera.add(bloomGroup);
function setBloom(v){
  v=Math.max(0,Math.min(1,v));
  bloomGroup.visible=v>0.001; bloomGroup.scale.setScalar(0.2+v*1.6);
  for(const p of bloomPetals) p.rotation.x=-1.3+v*1.15;
  bloomMat.opacity=v; bloomCenterMat.opacity=v; bloomCenter.scale.setScalar(0.3+v*1.2);
}

/* ===== Nền bình minh ===== */
function mix(a,b,t){ return `rgb(${Math.round(a[0]+(b[0]-a[0])*t)},${Math.round(a[1]+(b[1]-a[1])*t)},${Math.round(a[2]+(b[2]-a[2])*t)})`; }
function setBg(p){
  document.documentElement.style.setProperty("--bg-top",    mix([0x3a,0x1a,0x44],[0xf9,0xc6,0xd9],p));
  document.documentElement.style.setProperty("--bg-bottom", mix([0x1c,0x0c,0x26],[0x8e,0x3a,0x6e],p));
}

/* ===== Nút AR ===== */
const ctaBtn=document.getElementById("startAR");
let ctaShown=false;
function revealCTA(p){
  const k=Math.max(0,Math.min(1,(p-0.6)/0.4));
  if(hasGSAP){
    if(k<1){ G.set(ctaBtn,{opacity:k, y:(1-k)*28, scale:0.92+0.08*k}); ctaShown=false; }
    else if(!ctaShown){ G.set(ctaBtn,{opacity:1, y:0, scale:1}); ctaShown=true; }
  } else { ctaBtn.style.opacity=k; ctaBtn.style.transform=`translateY(${(1-k)*28}px) scale(${0.92+0.08*k})`; }
}
if(hasGSAP) G.set(ctaBtn,{opacity:0}); else ctaBtn.style.opacity=0;
if(hasGSAP && !reduceMotion){
  ctaBtn.addEventListener("mousemove",(e)=>{
    if(!ctaShown) return;
    const r=ctaBtn.getBoundingClientRect();
    G.to(ctaBtn,{ x:(e.clientX-(r.left+r.width/2))*0.3, y:(e.clientY-(r.top+r.height/2))*0.4, duration:.4, overwrite:"auto" });
  });
  ctaBtn.addEventListener("mouseleave",()=>{ if(ctaShown) G.to(ctaBtn,{ x:0,y:0,duration:.6,ease:"elastic.out(1,.4)" }); });
}

/* ===== i18n: nội dung 2 ngôn ngữ ===== */
const I18N = {
  zh: {
    eyebrowHero:"AR · 杜鵑花", titleMain:"杜鵑花", titleSub:"Azalea · Rhododendron",
    scrollHint:"向下滾動",
    lede1:'每逢春日，山坡再度<span class="accent">染上緋紅</span>——成千上萬朵杜鵑，於同一個節奏裡綻放。',
    note1:"杜鵑是高山的象徵，自冬末綻放至初夏；每一簇五片花瓣上點綴著細小的蜜斑，為蜂蝶指引方向。",
    lede2:'此刻，一朵將在<span class="accent">你的掌心綻放</span>。',
    note2:"將鏡頭對準標記圖卡，立體的花朵便會浮現眼前——旋轉、放大，細看每一層花瓣。",
    eyebrowEnter:"準備就緒", ledeEnter:"開啟真實世界。",
    ctaLabel:"開啟 AR 體驗", ctaAria:"開啟擴增實境體驗"
  },
  en: {
    eyebrowHero:"AR · Azalea", titleMain:"Azalea", titleSub:"杜鵑花 · Rhododendron",
    scrollHint:"Scroll down",
    lede1:'Each spring, the mountainsides <span class="accent">blush again</span> — thousands of azaleas blooming to a single rhythm.',
    note1:"The azalea is an emblem of the highlands, flowering from late winter into early summer; each cluster of five petals is freckled with tiny nectar spots that guide the bees.",
    lede2:'Now, one will <span class="accent">bloom in your hands</span>.',
    note2:"Point your camera at the marker card and a three-dimensional flower appears before you — rotate it, zoom in, explore each layer of petals.",
    eyebrowEnter:"Ready", ledeEnter:"Open the real world.",
    ctaLabel:"Launch AR experience", ctaAria:"Launch the augmented reality experience"
  }
};
function setI18N(lang){
  const dict=I18N[lang];
  document.querySelectorAll("[data-key]").forEach(el=>{
    const k=el.dataset.key; if(!(k in dict)) return;
    if(el.hasAttribute("data-html")) el.innerHTML=dict[k]; else el.textContent=dict[k];
  });
  ctaBtn.setAttribute("aria-label", dict.ctaAria);
}

/* ===== Tách chữ thủ công (dự phòng khi không có SplitText) ===== */
function splitCharsManual(el){
  const text=(el.textContent||"").normalize("NFC"); el.textContent="";
  return Array.from(text).map(ch=>{
    const sp=document.createElement("span"); sp.className="char"; sp.textContent=ch;
    if(ch===" ") sp.style.width="0.3em"; el.appendChild(sp); return sp;
  });
}

/* ===== Thiết lập hiệu ứng chữ (gọi lại được khi đổi ngôn ngữ) ===== */
let currentLang="zh";
let textSplits=[], textTweens=[];
function clearText(){
  textTweens.forEach(t=>{ if(t && t.scrollTrigger) t.scrollTrigger.kill(); if(t) t.kill(); });
  textTweens=[];
  textSplits.forEach(s=>{ try{ s.revert(); }catch(e){} });
  textSplits=[];
}
function setupText(firstLoad){
  // Tiêu đề hero: bay vào từng ký tự
  const heroMain=document.querySelector(".hero-title .t-main");
  let hc;
  if(window.SplitText){ const s=new window.SplitText(heroMain,{type:"chars"}); textSplits.push(s); hc=s.chars; }
  else { hc=splitCharsManual(heroMain); }
  textTweens.push(G.from(hc,{ yPercent:120, opacity:0, rotateZ:8, stagger:0.04,
    duration:1, ease:"power3.out", delay:firstLoad?0.2:0 }));
  const em=document.querySelector(".hero-title em");
  if(em) textTweens.push(G.from(em,{ opacity:0, y:18, duration:0.9, ease:"power2.out", delay:firstLoad?0.9:0.05 }));

  // Các câu thơ: tiếng Trung tách ký tự, tiếng Anh tách từ
  document.querySelectorAll(".lede").forEach(el=>{
    if(window.SplitText){
      const type=(currentLang==="zh")?"chars":"words";
      const s=new window.SplitText(el,{type}); textSplits.push(s);
      const pieces=(type==="chars")?s.chars:s.words;
      textTweens.push(G.from(pieces,{ y:26, opacity:0, stagger:0.045, duration:0.8, ease:"power3.out",
        scrollTrigger:{ trigger:el, start:"top 82%" } }));
    } else {
      textTweens.push(G.from(el,{ y:28, opacity:0, duration:0.9, ease:"power3.out",
        scrollTrigger:{ trigger:el, start:"top 82%" } }));
    }
  });

  // Ghi chú + eyebrow: hiện mềm
  document.querySelectorAll(".note, .eyebrow").forEach(el=>{
    textTweens.push(G.from(el,{ y:20, opacity:0, duration:0.9, ease:"power2.out",
      scrollTrigger:{ trigger:el, start:"top 88%" } }));
  });

  ST.refresh();
}

/* ===== Áp dụng ngôn ngữ ===== */
function applyLang(lang, firstLoad){
  currentLang=lang;
  if(hasGSAP) clearText();
  setI18N(lang);
  document.body.classList.toggle("lang-zh", lang==="zh");
  document.body.classList.toggle("lang-en", lang==="en");
  document.documentElement.lang = (lang==="zh") ? "zh-Hant" : "en";
  document.querySelectorAll(".lang-toggle button").forEach(b=>b.classList.toggle("active", b.dataset.lang===lang));
  if(hasGSAP) setupText(!!firstLoad);
}
document.querySelectorAll(".lang-toggle button").forEach(b=>{
  b.addEventListener("click",()=>{ if(b.dataset.lang!==currentLang) applyLang(b.dataset.lang,false); });
});

/* ===== Cuộn: Lenis + ScrollTrigger ===== */
let lenis=null, scrollVel=0;
const camState={ z:CAM_START_Z };

if(hasGSAP){
  document.body.classList.add("gsap-on");
  if(window.Lenis && !reduceMotion){
    lenis=new Lenis({ lerp:0.1, smoothWheel:true, smoothTouch:false });
    lenis.on("scroll",(e)=>{ ST.update(); scrollVel=e.velocity||0; });
    G.ticker.add((t)=> lenis.raf(t*1000)); G.ticker.lagSmoothing(0);
  }
  G.to(camState,{ z:CAM_END_Z, ease:"none",
    scrollTrigger:{ trigger:"#enter", start:"top bottom", end:"top top", scrub:reduceMotion?true:1 } });
  ST.create({ start:0, end:"max", scrub:reduceMotion?true:0.5, onUpdate:(self)=>setBg(self.progress) });
  ST.create({ trigger:"#enter", start:"top top", end:"+=130%", pin:true, scrub:reduceMotion?true:1,
    onUpdate:(self)=>{ setBloom(self.progress); revealCTA(self.progress); } });
  if(!reduceMotion){
    document.querySelectorAll(".note").forEach(el=>{
      G.to(el,{ yPercent:-12, ease:"none",
        scrollTrigger:{ trigger:el, start:"top bottom", end:"bottom top", scrub:true } });
    });
  }
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=> ST.refresh());
  addEventListener("load",()=> ST.refresh());
} else {
  const io=new IntersectionObserver((es)=>es.forEach(e=>{ if(e.isIntersecting) e.target.classList.add("in"); }),{threshold:0.25});
  document.querySelectorAll(".reveal").forEach(el=>io.observe(el));
  let lastY=scrollY;
  function onScroll(){
    const max=document.body.scrollHeight-innerHeight;
    const p=max>0?Math.min(1,Math.max(0,scrollY/max)):0;
    camState.z=CAM_START_Z+(CAM_END_Z-CAM_START_Z)*Math.min(1,p/0.8);
    setBg(p); setBloom((p-0.8)/0.2); revealCTA(p);
    scrollVel=(scrollY-lastY)*2; lastY=scrollY;
  }
  addEventListener("scroll",onScroll,{passive:true}); onScroll();
}

/* ===== Khởi tạo ngôn ngữ (mặc định: phồn thể) ===== */
applyLang("zh", true);

/* ===== Con trỏ / chạm ===== */
const pointer={ x:0,y:0,tx:0,ty:0 };
function onMove(e){ const t=e.touches?e.touches[0]:e;
  pointer.tx=(t.clientX/innerWidth-0.5)*2; pointer.ty=(t.clientY/innerHeight-0.5)*2; }
addEventListener("mousemove",onMove,{passive:true});
addEventListener("touchmove",onMove,{passive:true});

/* ===== Render loop ===== */
const clock=new THREE.Clock(); let running=true;
document.addEventListener("visibilitychange",()=>{ running=!document.hidden; if(running) clock.getDelta(); });
function animate(){
  requestAnimationFrame(animate);
  if(!running) return;
  const dt=Math.min(clock.getDelta(),0.05), t=clock.elapsedTime;

  camera.position.z += (camState.z-camera.position.z)*(reduceMotion?1:0.1);
  pointer.x += (pointer.tx-pointer.x)*0.05; pointer.y += (pointer.ty-pointer.y)*0.05;
  camera.position.x += (pointer.x*9-camera.position.x)*0.04;
  camera.position.y += (-pointer.y*6-camera.position.y)*0.04;
  camera.lookAt(pointer.x*3, -pointer.y*2, camera.position.z-40);

  scrollVel*=0.9;
  const turb=Math.min(Math.abs(scrollVel)*0.00025,0.05);
  const dir=Math.sign(scrollVel)||1;
  for(const m of petals){
    const u=m.userData;
    m.rotation.x+=u.spin; m.rotation.z+=u.spin2 + turb*dir; u.swayA+=dt*u.swayS;
    m.position.x+=Math.sin(u.swayA)*(u.swayR+turb*40)*dt; m.position.y-=u.drift*dt;
    if(m.position.z>camera.position.z+14 || m.position.y<-FIELD_Y) resetPetal(m,false);
  }
  const arr=pollenGeo.attributes.position.array;
  for(let i=0;i<POLLEN_COUNT;i++){
    const b=pBase[i];
    arr[i*3]=b.x+Math.sin(t*0.4+b.phase)*b.amp;
    arr[i*3+1]+=0.25*dt; if(arr[i*3+1]>FIELD_Y) arr[i*3+1]=-FIELD_Y;
    if(arr[i*3+2]>camera.position.z+14) arr[i*3+2]-=FIELD_Z;
  }
  pollenGeo.attributes.position.needsUpdate=true;
  pollenMat.opacity=0.6+Math.sin(t*1.5)*0.2; pollen.rotation.z=t*0.01;
  if(bloomGroup.visible) bloomGroup.rotation.z+=dt*0.1;
  renderer.render(scene,camera);
}
animate();

/* ===== Resize ===== */
addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  if(hasGSAP) ST.refresh();
});

/* ================================================================
   ĐIỂM BÀN GIAO (HOOK) SANG AR  —  sửa AR_URL hoặc khai báo window.startAzaleaAR
================================================================ */
const AR_URL="ar.html"; // TODO: đổi cho khớp
ctaBtn.addEventListener("click",()=>{
  document.getElementById("flash").classList.add("on");
  if(lenis) lenis.stop();
  setTimeout(()=>{
    if(typeof window.startAzaleaAR==="function") window.startAzaleaAR();
    else window.location.href=AR_URL;
  },850);
});
</script>
